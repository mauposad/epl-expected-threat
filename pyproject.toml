[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-xt"
version = "1.0.0"
description = "Expected Threat (xT) analysis of the 2015/16 Premier League using StatsBomb Open Data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mauricio Posadas" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "tqdm>=4.66",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4",
    "ipykernel>=6",
]
dev = ["pytest>=8", "ruff>=0.6", "nbconvert>=7"]

[project.scripts]
epl-xt = "epl_xt.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
